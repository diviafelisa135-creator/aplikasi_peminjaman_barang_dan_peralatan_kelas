<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ajukan Peminjaman — Peminjaman Barang Kelas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Peminjaman Barang Kelas</div>
    <nav>
      <a class="active" href="katalog.html">Katalog barang</a>
      <a href="history.html">History peminjaman saya</a>
    </nav>
    <div class="user">Nama peminjam | <a href="index.html">Keluar</a></div>
  </header>

  <main>
    <h1>Ajukan peminjaman</h1>
    <p class="subtitle">Proyektor &middot; Stok tersedia: 3</p>

    <div class="card form-card">
      <form action="history.html" method="get">
        <label for="jumlah">Jumlah</label>
        <input type="number" id="jumlah" name="jumlah" value="1" min="1" max="3" required>
        <div class="error">Jumlah melebihi stok. Maksimal 3 unit.</div>

        <div class="row">
          <div>
            <label for="tgl-pinjam">Tanggal pinjam</label>
            <input type="date" id="tgl-pinjam" name="tgl_pinjam" required>
          </div>
          <div>
            <label for="tgl-kembali">Perkiraan kembali</label>
            <input type="date" id="tgl-kembali" name="tgl_kembali" required>
          </div>
        </div>

        <label for="keperluan">Keperluan</label>
        <textarea id="keperluan" name="keperluan" placeholder="Contoh: praktikum kelas IF-1A"></textarea>

        <div class="form-actions">
          <button type="submit" class="btn">Kirim pengajuan</button>
          <a class="btn secondary" href="katalog.html">Batal</a>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
