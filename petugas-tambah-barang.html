<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tambah Barang — Peminjaman Barang Kelas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Peminjaman Barang Kelas</div>
    <nav>
      <a href="petugas-dashboard.html">Dashboard</a>
      <a class="active" href="petugas-barang.html">Data barang</a>
      <a href="petugas-kategori.html">Kategori</a>
      <a href="petugas-peminjam.html">Data peminjam</a>
      <a href="petugas-transaksi.html">Transaksi</a>
      <a href="petugas-laporan.html">Laporan</a>
    </nav>
    <div class="user">Nama petugas | <a href="index.html">Keluar</a></div>
  </header>

  <main>
    <h1>Tambah barang</h1>
    <p class="subtitle">Isi data barang baru.</p>

    <div class="card form-card">
      <form action="petugas-barang.html" method="get">
        <div class="row">
          <div>
            <label for="kode">Kode</label>
            <input type="text" id="kode" value="BRG 004" readonly>
          </div>
          <div>
            <label for="kategori">Kategori</label>
            <select id="kategori" required>
              <option value="">Pilih ▾</option>
              <option>Elektronik</option>
              <option>ATK</option>
              <option>Perlengkapan</option>
              <option>Lainnya</option>
            </select>
          </div>
        </div>

        <label for="nama">Nama barang</label>
        <input type="text" id="nama" placeholder="Nama barang" required>

        <div class="row">
          <div>
            <label for="jumlah">Jumlah</label>
            <input type="number" id="jumlah" value="0" min="0" required>
          </div>
          <div>
            <label for="kondisi">Kondisi</label>
            <select id="kondisi">
              <option>Baik</option>
              <option>Rusak ringan</option>
              <option>Rusak berat</option>
            </select>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn">Simpan barang</button>
          <a class="btn secondary" href="petugas-barang.html">Batal</a>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
